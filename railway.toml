# railway.toml

[build]
builder = "NIXPACKS"
# Remove apenas o @resvg (que causa o erro do webpack) sem tocar no cache do Railway
buildCommand = "rm -rf node_modules/@resvg && npm install && npm run build"

[deploy]
startCommand = "npx playwright install chromium --with-deps && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
