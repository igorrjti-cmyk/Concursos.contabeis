# railway.toml — Configuração de deploy no Railway
# Documentação: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npx playwright install chromium --with-deps && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Cron job: chama o worker a cada 5 minutos para processar a fila
[[services]]
name = "worker-cron"

[services.cron]
schedule = "*/5 * * * *"
command   = "curl -s -X POST $NEXT_PUBLIC_APP_URL/api/publicar/worker -H 'Authorization: Bearer $WORKER_SECRET' -H 'Content-Type: application/json'"
