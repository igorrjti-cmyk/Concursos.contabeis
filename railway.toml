# railway.toml

[build]
builder = "NIXPACKS"
# Remove node_modules do cache e reinstala do zero para evitar
# binários antigos (@resvg, etc.) que quebram o webpack build
buildCommand = "rm -rf node_modules && npm install && npm run build"

[deploy]
startCommand = "npx playwright install chromium --with-deps && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
